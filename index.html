<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Letter Drop</title>
    <!--<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="panel">
            <h1>Choose mode</h1>
            <p>English letters show the letter itself. Morse code shows dots and dashes, and you press the letter they spell.</p>
            <div class="modes">
                <button data-mode="english">English letters</button>
                <button data-mode="morse">Morse code</button>
            </div>
        </div>
    </div>
    <script>
        document.querySelectorAll('button[data-mode]').forEach(b =>
            b.addEventListener('click', () => { location.href = 'start.html?mode=' + b.dataset.mode; }));
    </script>
</body>
</html>
